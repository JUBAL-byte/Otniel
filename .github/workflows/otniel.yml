name: Otniel APK

# On every push to main: checks the link rules and the "new content" readers (also against
# the live otniel.org), builds the signed APK and publishes it as a Release
# (otniel-app-<number>) that can be downloaded straight onto the phone. Then it opens the
# app on an Android emulator and keeps screenshots in the "otniel-ci" pre-release.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: otniel-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (link rules and site readers, offline)
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew testReleaseUnitTest --no-daemon --stacktrace 2>&1 | tee test.log

      - name: Live check against otniel.org
        id: live
        continue-on-error: true
        env:
          LIVE: "1"
        run: |
          set -o pipefail
          ./gradlew testReleaseUnitTest --no-daemon --rerun-tasks --tests 'app.jubal.otniel.LiveSiteTest' 2>&1 | tee live.log

      - name: Signing key (from the repo's encrypted secrets)
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.OTNIEL_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No OTNIEL_KEYSTORE_B64 secret (see KEY.md): building for checking only, nothing is published"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/otniel.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          OTNIEL_KEYSTORE: ${{ runner.temp }}/otniel.jks
          OTNIEL_KEY_PASSWORD: ${{ secrets.OTNIEL_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          rm -f "$OTNIEL_KEYSTORE"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish APK
        if: steps.key.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="Otniel-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "otniel-app-${{ github.run_number }}" "$APK" \
            --target "${{ github.sha }}" \
            --title "בית ועד הר חברון ${{ github.run_number }}" \
            --notes "אתר ישיבת עתניאל ביישומון לטלפון. מתקינים את הקובץ $APK בטלפון (גם מעל גרסה קודמת)." \
            --latest

      - name: Keep the test results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p report
          cp test.log live.log build.log report/ 2>/dev/null || true
          for f in app/build/test-results/testReleaseUnitTest/*.xml; do [ -f "$f" ] && cp "$f" report/; done
          echo "live check: ${{ steps.live.outcome }}" > report/summary.txt
          grep -h -E "^(lessons|series|podcasts|faq|rabbis|books|about)" report/*.xml >> report/summary.txt 2>/dev/null || true
          (cd report && zip -q ../report.zip *)
          gh release delete otniel-ci --yes --cleanup-tag 2>/dev/null || true
          gh release create otniel-ci report.zip report/summary.txt \
            --target "${{ github.sha }}" \
            --title "בדיקות אחרונות" \
            --notes "תוצאות הבדיקות וצילומי מסך מהבנייה האחרונה" \
            --prerelease --latest=false

  screenshots:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Get the APK
        run: mv app-release.apk app.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # A recent Android, with a recent WebView (as on phones that get updates), on a common phone size
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          script: bash .github/shots.sh

      - name: Keep the screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls shots || exit 0
          gh release upload otniel-ci shots/* --repo "${{ github.repository }}" --clobber
